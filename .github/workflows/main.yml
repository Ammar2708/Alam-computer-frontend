name: Test SEO Build

on:
  push:
    branches:
      - seo-optimization
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_SITE_URL: https://alamcomputer.com
          VITE_API_URL: https://api.alamcomputer.com
        run: npm run build
